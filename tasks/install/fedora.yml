---
# Based on https://docs.docker.com/engine/install/fedora/
- name: Ensure old versions of Docker are not installed
  ansible.builtin.dnf:
    name:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-selinux
      - docker-engine-selinux
      - docker-engine
    state: absent
    # Fedora 41+ reports ansible_pkg_mgr=dnf5, which makes the dnf module
    # dispatch to the dnf5 backend. The test images do not ship the
    # python3-libdnf5 bindings, so use the dnf4 backend (python3-dnf).
    use_backend: dnf4
  changed_when: false

- name: Install Docker dependencies
  ansible.builtin.dnf:
    name:
      - dnf-plugins-core
    state: present
    use_backend: dnf4
  register: result
  until: result is success
  retries: 5
  delay: 5
  changed_when: false

- name: Add Docker repository
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/fedora/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'

- name: Install Docker
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    use_backend: dnf4
  register: result
  until: result is success
  retries: 5
  delay: 5
  changed_when: false

# docker-ce on Fedora pulls the legacy iptables backend. Inside the
# containers the tests run under rootless podman, there is no ip_tables
# kernel module, so dockerd cannot create its NAT table and fails to start.
# Switch to the nftables backend, which is supported in user namespaces.
- name: Install the nftables variant of iptables for docker-ce
  ansible.builtin.dnf:
    name:
      - iptables-nft
    state: present
    use_backend: dnf4
  register: result
  until: result is success
  retries: 5
  delay: 5
  changed_when: false

- name: Remove the legacy iptables backend broken under rootless podman
  ansible.builtin.dnf:
    name:
      - iptables-legacy
    state: absent
    use_backend: dnf4
  changed_when: false