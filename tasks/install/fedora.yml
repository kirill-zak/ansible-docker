---
# Based on https://docs.docker.com/engine/install/fedora/
- name: Ensure old versions of Docker are not installed
  ansible.builtin.dnf:
    name:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-selinux
      - docker-engine-selinux
      - docker-engine
    state: absent
  changed_when: false

- name: Install Docker dependencies
  ansible.builtin.dnf:
    name: 
      - dnf-plugins-core
    state: present
  register: result
  until: result is success
  retries: 5
  delay: 5
  changed_when: false

- name: Add Docker repository
  ansible.builtin.command: dnf config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo
  changed_when: false

- name: Install Docker
  ansible.builtin.dnf:
    name:
      - docker-ce 
      - docker-ce-cli 
      - containerd.io
    state: present
  register: result
  until: result is success
  retries: 5
  delay: 5
  changed_when: false

- name: Create directory for Docker proxy configuration
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d/
    state: directory
    owner: root
    group: root
    mode: '0755'
  changed_when: false    

- name: Create Docker service proxy configuration
  ansible.builtin.template:
    src: 10_docker_proxy.conf.j2
    dest: /etc/systemd/system/docker.service.d/10_docker_proxy.conf
    owner: root
    group: root
    mode: '0644'
  changed_when: false

- name: Reload Docker service configuration
  ansible.builtin.systemd:
    name: docker.service
    daemon_reload: yes
  changed_when: false
