---
# Based on https://docs.docker.com/engine/install/centos/
- name: Ensure old versions of Docker are not installed
  ansible.builtin.dnf:
    name:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-selinux
      - docker-engine-selinux
      - docker-engine
    state: absent
  changed_when: false

- name: Install Docker dependencies
  ansible.builtin.dnf:
    name:
      - dnf-plugins-core
    state: present
  register: result
  until: result is success
  retries: 5
  delay: 5
  changed_when: false

- name: Add Docker repository
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'

- name: Install Docker
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
  register: result
  until: result is success
  retries: 5
  delay: 5
  changed_when: false