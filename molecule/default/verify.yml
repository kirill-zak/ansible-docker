---
- name: Verify
  hosts: all
  tasks:
    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Check if docker package installed
      ansible.builtin.assert:
        that: 
          - "'docker-ce' in ansible_facts.packages"
          - "'containerd.io' in ansible_facts.packages"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Check if docker service run (for CentOS or Fedora)
      ansible.builtin.assert:
        that: "'running' in ansible_facts.services['docker.service']['state']"
      when: ansible_distribution == 'CentOS' or ansible_distribution == 'Fedora'

    - name: Check if docker service run (for Ubuntu or Debian)
      ansible.builtin.assert:
        that: "'running' in ansible_facts.services['docker']['state']"
      when: ansible_distribution == 'Ubuntu' or ansible_distribution == 'Debian'