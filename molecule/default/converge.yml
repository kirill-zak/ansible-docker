---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

  tasks:
    - name: "Include kirill_zak.ansible_docker"
      include_role:
        name: "kirill_zak.ansible_docker"
